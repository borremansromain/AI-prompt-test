spring:
  application:
    name: stock-api

  # Virtual threads (Java 21) — 1 virtual thread par requete HTTP (Prompt 6.2)
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stock_db}
    username: ${DB_USER:stock_user}
    password: ${DB_PASSWORD:secret_dev_only}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway = source de verite, Hibernate ne cree rien
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8081/realms/stock-app}
          jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8081/realms/stock-app/protocol/openid-connect/certs}

server:
  port: 8080
  error:
    include-stacktrace: never     # stack trace en LOG uniquement, jamais dans la reponse
    include-message: always

logging:
  level:
    com.stock: ${LOG_LEVEL:INFO}
    org.springframework.security: INFO   # pas DEBUG = pas de token dans les logs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: stock-api
    version: 0.1.0-SNAPSHOT
