spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.stock: DEBUG
    org.flywaydb: INFO
    org.springframework.security: INFO

# Dev uniquement : Swagger UI + spec OpenAPI accessibles sans token
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
